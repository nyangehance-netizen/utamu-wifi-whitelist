plugins {
    id 'com.android.application'
}

android {
    namespace 'tz.utamu.whitelist'
    compileSdk 34

    defaultConfig {
        applicationId 'tz.utamu.whitelist'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No libraries: the app uses only the Android platform.
