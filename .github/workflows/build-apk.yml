name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu machines come with the Android SDK in $ANDROID_HOME.
      - name: Build debug APK
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          if ! ./gradlew --no-daemon --console=plain assembleDebug 2>&1 | tee build.log; then
            # Surface the compiler errors as run annotations (readable without the log).
            grep -E "error:|ERROR|FAILURE|What went wrong|\.java:[0-9]+" build.log | head -30 | while IFS= read -r line; do
              echo "::error::${line:0:300}"
            done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: utamu-whitelist-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Keep the latest APK on the 'apk' branch (fetchable with plain git).
      - name: Save APK to apk branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/utamu-whitelist.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rfq .
          cp /tmp/utamu-whitelist.apk utamu-whitelist.apk
          git add utamu-whitelist.apk
          git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f origin apk

      # Also publish it as a Release you can download on the phone.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest /tmp/utamu-whitelist.apk \
            --title "UTAMU Whitelist (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Download utamu-whitelist.apk on your phone and install it."
